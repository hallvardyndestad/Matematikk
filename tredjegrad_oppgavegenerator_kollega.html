function drawGrid(svg,q,uid){svg.innerHTML='';arrow(svg,'gridArrow'+uid);const W=900,H=700,L=62,R=24,T=25,B=50,{xmin,xmax,ymin,ymax,xStep,yStep,yGridStep}=q.graf,sx=x=>L+(x-xmin)/(xmax-xmin)*(W-L-R),sy=y=>T+(ymax-y)/(ymax-ymin)*(H-T-B);for(let x=Math.ceil(xmin);x<=xmax;x++)svg.append(el('line',{x1:sx(x),y1:T,x2:sx(x),y2:H-B,class:'grid'}));for(let y=Math.ceil(ymin/yGridStep)*yGridStep;y<=ymax;y+=yGridStep)svg.append(el('line',{x1:L,y1:sy(y),x2:W-R,y2:sy(y),class:'grid'}));svg.append(el('line',{x1:L,y1:sy(0),x2:W-R,y2:sy(0),class:'axis','marker-end':`url(#gridArrow${uid})`}));svg.append(el('line',{x1:sx(0),y1:H-B,x2:sx(0),y2:T,class:'axis','marker-end':`url(#gridArrow${uid})`}));for(let x=Math.ceil(xmin/xStep)*xStep;x<=xmax;x+=xStep)if(Math.abs(x)>EPS)svg.append(el('text',{x:sx(x),y:sy(0)+19,'text-anchor':'middle',class:'number'},fmt(x)));for(let y=Math.ceil(ymin/yStep)*yStep;y<=ymax;y+=yStep)if(Math.abs(y)>EPS)svg.append(el('text',{x:sx(0)-10,y:sy(y)+4,'text-anchor':'end',class:'number'},fmt(y)));svgMath(svg,'x',W-R-7,sy(0)-19,40,30,15);svgMath(svg,'y',sx(0)+19,T+7,40,30,15)}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function pick(category,n){return shuffle(BANK[category]).slice(0,n)}function makePage(q,n){const page=document.createElement('section');page.className='page';page.innerHTML=`<header class="page-header"><div class="page-kicker">Tredjegradsfunksjoner · Oppgave ${n}</div><h1>Fortegnslinjer og skisse</h1><div class="page-formula">${formula(q)}</div><p class="instruction">Les av fortegnene og tegn deretter en god skisse av grafen til \\(f\\).</p></header><svg class="signChart" viewBox="0 0 900 350"></svg><div class="legend"><span><i class="sample"></i>positivt</span><span><i class="sample dashed"></i>negativt</span></div><h2 class="sketch-title">Skisse av \\(f\\)</h2><svg class="coordinateSystem" viewBox="0 0 900 700"></svg>`;drawSigns(page.querySelector('.signChart'),q,n);drawGrid(page.querySelector('.coordinateSystem'),q,n);return page}async function typeset(nodes){if(window.MathJax?.typesetPromise)return MathJax.typesetPromise(nodes);return Promise.resolve()}async function generate(){const nu=Math.max(0,parseInt($('countUnique').value)||0),ne=Math.max(0,parseInt($('countExtremum').value)||0),ns=Math.max(0,parseInt($('countStationary').value)||0);if(nu>BANK.unike.length||ne>BANK.nullpunkt_ekstremalpunkt.length||ns>BANK.stasjonart_vendepunkt.length){alert(`Du kan maksimalt velge ${BANK.unike.length} med unike nullpunkter og ekstremalpunkter, ${BANK.nullpunkt_ekstremalpunkt.length} der et nullpunkt kan være et ekstremalpunkt og ${BANK.stasjonart_vendepunkt.length} med stasjonært vendepunkt.`);return}const selected=shuffle([...pick('unike',nu),...pick('nullpunkt_ekstremalpunkt',ne),...pick('stasjonart_vendepunkt',ns)]),w=$('worksheet');w.innerHTML='';if(!selected.length){w.innerHTML='<div class="empty">Velg minst én oppgave.</div>';return}selected.forEach((q,i)=>w.append(makePage(q,i+1)));await typeset([w]);$('menuScreen').style.display='none';$('worksheetControls').style.display='flex';window.scrollTo(0,0)}
$('bankInfo').textContent=`Oppgavebanken inneholder ${BANK.unike.length} oppgaver med unike nullpunkter og ekstremalpunkter, ${BANK.nullpunkt_ekstremalpunkt.length} der et nullpunkt kan være et ekstremalpunkt og ${BANK.stasjonart_vendepunkt.length} med stasjonært vendepunkt.`;$('countUnique').max=BANK.unike.length;$('countExtremum').max=BANK.nullpunkt_ekstremalpunkt.length;$('countStationary').max=BANK.stasjonart_vendepunkt.length;$('generate').addEventListener('click',generate);$('backToMenu').addEventListener('click',()=>{$('worksheet').innerHTML='';$('worksheetControls').style.display='none';$('menuScreen').style.display='flex';window.scrollTo(0,0)});$('print').addEventListener('click',async()=>{await typeset([$('worksheet')]);if(document.fonts?.ready)await document.fonts.ready;window.print()});
